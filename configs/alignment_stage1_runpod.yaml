seed: 17
output_dir: outputs/alignment_stage1_multi
max_train_records:
min_free_vram_gb: 22

data:
  # RunPod variant: all paths relative to the repo root (run from repo root).
  # Multi-granularity alignment target (sentence + word + phone).
  task: multi_all
  train_jsonl: external/so762/train_multi_all.jsonl
  seq_data_dir: external/seq_data_librispeech
  raw_data_root: external/speechocean762

hia:
  repo: external/apa-hia-framework
  checkpoint: external/hia_ckpt/best_audio_model.pth
  embed_dim: 48
  num_heads: 1
  depth: 3
  dropout: 0.1
  seq_len: 50

qwen:
  base_model: Qwen/Qwen2-Audio-7B-Instruct
  # Pull from HuggingFace on RunPod (pre-download with huggingface-cli, see SETUP_RUNPOD.md).
  local_files_only: false
  torch_dtype: bfloat16
  device_map: auto
  quantization: 4bit
  projector_hidden_dim:
  projector_dropout: 0.0

train:
  num_epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.0
  num_workers: 0
