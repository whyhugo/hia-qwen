seed: 17

data:
  task: multi_all
  test_jsonl: external/so762/test_multi_all.jsonl
  seq_data_dir: external/seq_data_librispeech
  raw_data_root: external/speechocean762

hia:
  repo: external/apa-hia-framework
  checkpoint: external/hia_ckpt/best_audio_model.pth
  embed_dim: 48
  num_heads: 1
  depth: 3
  dropout: 0.1
  seq_len: 50

qwen:
  base_model: Qwen/Qwen2-Audio-7B-Instruct
  local_files_only: false
  torch_dtype: bfloat16
  device_map: auto
  quantization: 4bit
  projector_hidden_dim:
  projector_dropout: 0.0

eval:
  checkpoint: outputs/joint_lora_stage2_multi
  out_dir: outputs/joint_lora_stage2_multi/eval_test
  max_records:
  # Batched left-padded generation. The eval script runs a padding self-check
  # on the first batch and aborts if batched != per-row output. A100 80GB has
  # plenty of headroom; bump to 32 if you want it even faster.
  batch_size: 16
  max_new_tokens: 1536
  num_workers: 0
