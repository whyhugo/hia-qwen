# Ablation: LoRA-only, NO HIA soft prompt injection.
# Same data / LoRA / hyperparams as joint_lora_stage2.yaml; the only change is
# data.use_hia=false, so the prompt carries no <|hia_*|> placeholders and the
# HIA features are never injected. Isolates the contribution of HIA.
seed: 17
exp_name: s2_ablation_noHIA_r8_lr1e-4_ep3
output_dir: outputs/joint_lora_stage2_ablation
max_train_records:
min_free_vram_gb: 22

data:
  task: multi_all
  use_hia: false          # <-- ablation switch
  train_jsonl: /datas/store163/whyhugo/ms-qwen2-reproduce/data/processed/so762/train_multi_all.jsonl
  seq_data_dir: /datas/store163/whyhugo/apa-hia-framework/data/seq_data_librispeech
  raw_data_root: /datas/store163/whyhugo/datasets/speechocean762

hia:
  repo: /datas/store163/whyhugo/apa-hia-framework
  checkpoint: /datas/store163/whyhugo/apa-hia-framework/exp/hia_seed17/models/best_audio_model.pth
  embed_dim: 48
  num_heads: 1
  depth: 3
  dropout: 0.1
  seq_len: 50

qwen:
  base_model: Qwen/Qwen2-Audio-7B-Instruct
  local_files_only: true
  torch_dtype: bfloat16
  device_map: auto
  quantization: 4bit
  projector_hidden_dim:
  projector_dropout: 0.0
  projector_checkpoint:    # no projector needed; unused in ablation

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

train:
  num_epochs: 6
  batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.0
  num_workers: 0
